
[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "srsinst.dg645"
description = "Python instrument driver for SRS DG645 Digital Delay Generator"
readme = "README.md"
requires-python = ">=3.7"
keywords = ["DG645", "SRS", "Stanford Research Systems", "delay generator", "pulse generator"]
license = {text = "MIT license"}
classifiers = [
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Science/Research",
        "License :: OSI Approved :: MIT License",
        "Programming Language :: Python :: 3.7",
        "Programming Language :: Python :: 3.8",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
        "Topic :: Scientific/Engineering"
]
dependencies = [
    "srsgui>=0.4.5",
    "python-vxi11",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "srsinst.dg645.__version__"}

[project.urls]
homepage = "https://github.com/thinkSRS/srsinst.dg645"
repository = "https://github.com/thinkSRS/srsinst.dg645.git"
